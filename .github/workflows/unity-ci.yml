name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UNITY_VERSION: 2022.3.49f1

jobs:
  static:
    name: Static harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run architecture check
        shell: pwsh
        run: ./scripts/harness/check-architecture.ps1

  editmode:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: artifacts/editmode
          customParameters: -nographics
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: artifacts/editmode

  build:
    name: Standalone Windows build
    runs-on: ubuntu-latest
    needs: editmode
    steps:
      - uses: actions/checkout@v4
      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: CiBuild.PerformBuild
          customParameters: -nographics
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingfeng-windows-build
          path: Builds/**/*.exe
